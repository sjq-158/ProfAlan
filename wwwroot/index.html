<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProfAlan</title>
    <base href="/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />

    <script>
        // Apply the saved palette before first paint so the page never flashes the default colors.
        (function () {
            try {
                var palette = localStorage.getItem("profalan.palette");
                if (palette) document.documentElement.setAttribute("data-palette", palette);
            } catch (e) { }
        })();
    </script>
    <script src="js/profalan.js"></script>
</head>

<body>
    <div id="app">
        <div style="display:grid;place-items:center;height:100vh;font-family:'Fira Code',monospace;font-size:13px;opacity:.6">
            Loading ProfAlan
        </div>
    </div>

    <div id="blazor-error-ui">
        Something went wrong while rendering this page.
        <a href="." class="reload">Reload</a>
        <span class="dismiss" aria-label="Dismiss">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12" /></svg>
        </span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
