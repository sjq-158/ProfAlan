<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProfAlan</title>
    <base href="/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />

    <script>
        // apply the saved theme before first paint (no flash)
        (function () {
            if (localStorage.getItem("profalan-theme") === "dark") {
                document.documentElement.classList.add("dark");
            }
        })();

        window.profAlanTheme = {
            isDark: function () {
                return document.documentElement.classList.contains("dark");
            },
            toggle: function () {
                var dark = document.documentElement.classList.toggle("dark");
                localStorage.setItem("profalan-theme", dark ? "dark" : "light");
                return dark;
            }
        };
    </script>

    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="flex h-screen items-center justify-center font-mono text-sm text-neutral-500">Loading…</div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
